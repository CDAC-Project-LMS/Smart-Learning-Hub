# ============================================================
# Smart Learning Hub - Application Configuration
# ============================================================

spring.application.name=smart-learning-hub-backend
server.port=8080

# ---------------- Database ----------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------- JWT ----------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ---------------- CORS ----------------
app.cors.allowed-origins=${FRONTEND_URL}

# ---------------- Mail ----------------
app.frontend.reset-password-url=${FRONTEND_URL}/reset-password

# ---------------- External Services ----------------
app.certificate-service.base-url=${CERTIFICATE_SERVICE_URL}
app.ai-service.base-url=${AI_SERVICE_URL}

# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.com.smartlearninghub=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n

# ---------------- Swagger ----------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------- Payment ----------------
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}

frontend.url=${FRONTEND_URL}

# ---------------- File Upload ----------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads